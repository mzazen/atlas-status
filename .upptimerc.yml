# حالة خدمات أطلس — Upptime (مفتوح المصدر، شغّال على GitHub Actions من غير سيرفر)
# الروابط الحقيقية مخفية في السر SECRET_SITE (رابط التطبيق) — الصفحة عامة.
owner: mzazen
repo: atlas-status

# اللي بيتعمله Issue لما خدمة تقع (GitHub بيبعتله إيميل وإشعار على الموبايل)
assignees:
  - mzazen

sites:
  - name: تطبيق أطلس
    url: $SECRET_SITE
  - name: قواعد البيانات والخدمات
    url: $SECRET_SITE/api/health
    maxResponseTime: 10000

